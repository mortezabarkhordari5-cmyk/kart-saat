<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>کارت ساعت | حساب‌وکتاب و حضور کارگران</title>
  <style>
    :root {
      --primary: #1976d2;
      --primary-dark: #115293;
      --success: #2e7d32;
      --danger: #c62828;
      --warning: #f57f17;
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #212121;
      --border: #e0e0e0;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding-bottom: 70px; }
    header { background: var(--primary); color: #fff; padding: 14px 18px; text-align: center; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
    header h1 { margin: 0; font-size: 1.25rem; }
    header p { margin: 4px 0 0; font-size: 0.8rem; opacity: 0.9; }

    .container { max-width: 600px; margin: 0 auto; padding: 12px; }
    .card { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); border: 1px solid var(--border); }
    .card h2 { font-size: 1rem; margin: 0 0 12px; color: var(--primary-dark); display: flex; align-items: center; gap: 6px; }

    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; color: #424242; }
    input, select, button { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); font-size: 0.95rem; margin-bottom: 10px; }
    input:focus, select:focus { outline: none; border-color: var(--primary); }

    .btn { cursor: pointer; border: none; font-weight: bold; transition: 0.2s; color: #fff; border-radius: 8px; }
    .btn-primary { background: var(--primary); }
    .btn-success { background: var(--success); }
    .btn-danger { background: var(--danger); }
    .btn-warning { background: var(--warning); }
    .btn:active { transform: scale(0.98); }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .camera-box { background: #000; border-radius: 8px; overflow: hidden; position: relative; margin-bottom: 10px; aspect-ratio: 4/3; display: flex; align-items: center; justify-content: center; }
    video, #capturedPhoto { width: 100%; height: 100%; object-fit: cover; }
    .canvas-hidden { display: none; }

    .location-badge { background: #e8f5e9; color: #2e7d32; padding: 8px; border-radius: 6px; font-size: 0.8rem; margin-bottom: 10px; border: 1px dashed #81c784; text-align: center; }

    .record-item { background: #fafafa; border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 10px; }
    .record-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-bottom: 1px solid #eee; padding-bottom: 6px; }
    .badge { font-size: 0.75rem; padding: 3px 8px; border-radius: 12px; color: #fff; }
    .badge-in { background: var(--success); }
    .badge-out { background: var(--danger); }

    #sigCanvas { border: 2px dashed #999; border-radius: 8px; width: 100%; height: 130px; background: #fff; touch-action: none; cursor: crosshair; }

    /* Printable Settlement Sheet */
    @media print {
      body * { visibility: hidden; }
      #printableSettlement, #printableSettlement * { visibility: visible; }
      #printableSettlement { position: absolute; left: 0; top: 0; width: 100%; padding: 20px; font-size: 12pt; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body>

<header>
  <h1>کارت ساعت ⏱️</h1>
  <p>سامانه ثبت حضور، چهره، موقعیت و تسویه‌حساب قانونی کارگران</p>
</header>

<div class="container">

  <!-- Worker Select / Add -->
  <div class="card">
    <h2>👤 انتخاب یا افزودن کارگر</h2>
    <div class="grid-2">
      <input type="text" id="workerName" placeholder="نام و نام خانوادگی">
      <input type="number" id="dailyWage" placeholder="دستمزد روزانه (تومان)">
    </div>
    <button class="btn btn-primary" onclick="addWorker()">+ ثبت کارگر جدید</button>
    <label for="workerSelect">کارگر فعلی جهت ثبت ساعت:</label>
    <select id="workerSelect" onchange="loadWorkerSummary()"></select>
  </div>

  <!-- Timecard Clock-In / Out with Camera & GPS -->
  <div class="card">
    <h2>📸 ثبت ورود / خروج با عکس و GPS</h2>
    
    <div class="camera-box">
      <video id="webcam" autoplay playsinline></video>
      <img id="capturedPhoto" style="display:none;" />
    </div>

    <div class="grid-2">
      <button class="btn btn-warning" onclick="startCamera()">📷 روشن کردن دوربین</button>
      <button class="btn btn-primary" onclick="getGPS()">📍 دریافت لوکیشن (GPS)</button>
    </div>

    <div id="gpsStatus" class="location-badge">GPS هنوز دریافت نشده است.</div>

    <div class="grid-2" style="margin-top: 6px;">
      <button class="btn btn-success" onclick="punchClock('ورود')">✅ ثبت ساعت ورود</button>
      <button class="btn btn-danger" onclick="punchClock('خروج')">🚪 ثبت ساعت خروج</button>
    </div>
    <canvas id="photoCanvas" class="canvas-hidden"></canvas>
  </div>

  <!-- Advance / Musaedeh -->
  <div class="card">
    <h2>💰 ثبت مساعده و پرداختی نقد</h2>
    <div class="grid-2">
      <input type="number" id="musaedehAmount" placeholder="مبلغ مساعده (تومان)">
      <button class="btn btn-warning" onclick="addMusaedeh()">کسر به عنوان مساعده</button>
    </div>
  </div>

  <!-- Summary & Legal Settlement -->
  <div class="card">
    <h2>📋 خلاصه کارکرد و برگه تسویه</h2>
    <div id="summaryBox" style="font-size: 0.9rem; line-height: 1.8;">
      کارگری انتخاب نشده است.
    </div>

    <label style="margin-top: 10px;">امضای دیجیتال کارگر (روی کادر زیر بکشید):</label>
    <canvas id="sigCanvas"></canvas>
    <button class="btn btn-outline" style="background:#eee; color:#333;" onclick="clearSignature()">پاک کردن امضا</button>

    <button class="btn btn-primary" style="margin-top: 8px;" onclick="generateSettlement()">📄 صدور و چاپ برگه تسویه قانونی</button>
  </div>

  <!-- Records Log -->
  <div class="card">
    <h2>📜 ترددها و لاگ‌های ثبت‌شده</h2>
    <div id="recordsList">هنوز ترددی ثبت نشده است.</div>
  </div>

</div>

<!-- Printable Paper Template -->
<div id="printableSettlement" style="display: none;"></div>

<script>
  // Database State in LocalStorage
  let db = JSON.parse(localStorage.getItem('kart_saat_db')) || {
    workers: [],
    logs: [],
    musaedeh: []
  };

  function saveDB() {
    localStorage.setItem('kart_saat_db', JSON.stringify(db));
  }

  // Camera handling
  const video = document.getElementById('webcam');
  const photoCanvas = document.getElementById('photoCanvas');
  let currentStream = null;
  let lastPhotoData = null;

  async function startCamera() {
    try {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      currentStream = await navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: "user" }, 
        audio: false 
      });
      video.srcObject = currentStream;
      video.style.display = "block";
      document.getElementById('capturedPhoto').style.display = "none";
    } catch (err) {
      alert("دسترسی به دوربین داده نشد یا دستگاه پشتیبانی نمی‌کند.");
    }
  }

  function snapPhoto() {
    if (!video.videoWidth) return null;
    photoCanvas.width = video.videoWidth;
    photoCanvas.height = video.videoHeight;
    const ctx = photoCanvas.getContext('2d');
    ctx.drawImage(video, 0, 0);
    return photoCanvas.toDataURL('image/jpeg', 0.6);
  }

  // GPS handling
  let currentLocation = null;
  function getGPS() {
    const status = document.getElementById('gpsStatus');
    status.innerText = "در حال گرفتن موقعیت ماهواره‌ای...";
    if (!navigator.geolocation) {
      status.innerText = "دستگاه شما از GPS پشتیبانی نمی‌کند.";
      return;
    }
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        currentLocation = {
          lat: pos.coords.latitude.toFixed(5),
          lng: pos.coords.longitude.toFixed(5),
          accuracy: Math.round(pos.coords.accuracy)
        };
        status.innerHTML = `موقعیت ثبت شد: عرض ${currentLocation.lat}، طول ${currentLocation.lng} (دقت: ±${currentLocation.accuracy} متر)`;
      },
      (err) => {
        status.innerText = "خطا در دریافت لوکیشن: لطفاً GPS را روشن کنید.";
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  }

  // Worker Management
  function addWorker() {
    const name = document.getElementById('workerName').value.trim();
    const wage = Number(document.getElementById('dailyWage').value);
    if (!name || !wage) return alert("نام و دستمزد کارگر را وارد کنید.");
    
    const worker = { id: Date.now(), name, wage };
    db.workers.push(worker);
    saveDB();
    renderWorkerSelect();
    document.getElementById('workerName').value = '';
    document.getElementById('dailyWage').value = '';
    alert("کارگر با موفقیت ثبت شد.");
  }

  function renderWorkerSelect() {
    const select = document.getElementById('workerSelect');
    select.innerHTML = '<option value="">-- انتخاب کنید --</option>';
    db.workers.forEach(w => {
      select.innerHTML += `<option value="${w.id}">${w.name} (روزی ${w.wage.toLocaleString('fa-IR')} تومان)</option>`;
    });
  }

  // Clock In / Clock Out
  function punchClock(type) {
    const workerId = document.getElementById('workerSelect').value;
    if (!workerId) return alert("ابتدا کارگر را انتخاب کنید.");

    const photo = snapPhoto();
    const now = new Date();
    const record = {
      id: Date.now(),
      workerId: Number(workerId),
      type, // 'ورود' or 'خروج'
      timestamp: now.toLocaleString('fa-IR'),
      rawTime: now.getTime(),
      location: currentLocation || { lat: "نامشخص", lng: "نامشخص" },
      photo: photo || null
    };

    db.logs.push(record);
    saveDB();
    renderRecords();
    loadWorkerSummary();
    alert(`ساعت ${type} برای این کارگر ثبت شد.`);
  }

  // Musaedeh
  function addMusaedeh() {
    const workerId = document.getElementById('workerSelect').value;
    const amount = Number(document.getElementById('musaedehAmount').value);
    if (!workerId || !amount) return alert("کارگر و مبلغ مساعده را مشخص کنید.");

    db.musaedeh.push({
      id: Date.now(),
      workerId: Number(workerId),
      amount,
      date: new Date().toLocaleDateString('fa-IR')
    });
    saveDB();
    document.getElementById('musaedehAmount').value = '';
    loadWorkerSummary();
    alert("مساعده با موفقیت ثبت و از حساب کارگر کسر شد.");
  }

  // Render logs
  function renderRecords() {
    const list = document.getElementById('recordsList');
    if (!db.logs.length) {
      list.innerHTML = 'هنوز ترددی ثبت نشده است.';
      return;
    }
    list.innerHTML = db.logs.slice().reverse().map(l => {
      const worker = db.workers.find(w => w.id === l.workerId);
      const workerName = worker ? worker.name : "نامشخص";
      return `
        <div class="record-item">
          <div class="record-header">
            <strong>${workerName}</strong>
            <span class="badge ${l.type === 'ورود' ? 'badge-in' : 'badge-out'}">${l.type}</span>
          </div>
          <div>⏰ زمان: ${l.timestamp}</div>
          <div>📍 لوکیشن: ${l.location.lat}, ${l.location.lng}</div>
          ${l.photo ? `<div style="margin-top:6px;"><img src="${l.photo}" style="width:70px; height:70px; border-radius:6px; object-fit:cover;"></div>` : ''}
        </div>
      `;
    }).join('');
  }

  // Calculate & Summary
  function loadWorkerSummary() {
    const workerId = Number(document.getElementById('workerSelect').value);
    const box = document.getElementById('summaryBox');
    if (!workerId) {
      box.innerHTML = 'کارگری انتخاب نشده است.';
      return;
    }
    const worker = db.workers.find(w => w.id === workerId);
    const logs = db.logs.filter(l => l.workerId === workerId);
    const musaedehs = db.musaedeh.filter(m => m.workerId === workerId);

    const totalMusaedeh = musaedehs.reduce((acc, cur) => acc + cur.amount, 0);
    const punchCount = logs.length;
    // محاسبه تقریبی روزها بر اساس تعداد ثبت ورود
    const daysWorked = logs.filter(l => l.type === 'ورود').length || 1;
    const totalWage = daysWorked * worker.wage;
    const remaining = totalWage - totalMusaedeh;

    box.innerHTML = `
      <strong>نام کارگر:</strong> ${worker.name}<br>
      <strong>نرخ روزمزد:</strong> ${worker.wage.toLocaleString('fa-IR')} تومان<br>
      <strong>تعداد شیفت/روزهای حاضر:</strong> ${daysWorked} روز<br>
      <strong>کل کارکرد ناخالص:</strong> ${totalWage.toLocaleString('fa-IR')} تومان<br>
      <strong>مجموع مساعده‌های دریافتی:</strong> ${totalMusaedeh.toLocaleString('fa-IR')} تومان<br>
      <hr style="border:none; border-top:1px solid #ccc;">
      <strong style="color:var(--success); font-size:1.05rem;">مبلغ خالص قابل پرداخت: ${remaining.toLocaleString('fa-IR')} تومان</strong>
    `;
  }

  // Signature Pad
  const sigCanvas = document.getElementById('sigCanvas');
  const sigCtx = sigCanvas.getContext('2d');
  let writing = false;

  function resizeSigCanvas() {
    sigCanvas.width = sigCanvas.offsetWidth;
    sigCanvas.height = sigCanvas.offsetHeight;
  }
  window.addEventListener('load', () => {
    resizeSigCanvas();
    renderWorkerSelect();
    renderRecords();
    startCamera();
  });

  sigCanvas.addEventListener('pointerdown', (e) => { writing = true; sigCtx.beginPath(); sigCtx.moveTo(e.offsetX, e.offsetY); });
  sigCanvas.addEventListener('pointermove', (e) => { if(writing){ sigCtx.lineTo(e.offsetX, e.offsetY); sigCtx.stroke(); } });
  window.addEventListener('pointerup', () => writing = false);

  function clearSignature() {
    sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);
  }

  // Printable Legal Settlement
  function generateSettlement() {
    const workerId = Number(document.getElementById('workerSelect').value);
    if (!workerId) return alert("ابتدا کارگر را انتخاب کنید.");
    const worker = db.workers.find(w => w.id === workerId);
    const musaedehs = db.musaedeh.filter(m => m.workerId === workerId);
    const logs = db.logs.filter(l => l.workerId === workerId);
    const days = logs.filter(l => l.type === 'ورود').length || 1;
    const totalMusaedeh = musaedehs.reduce((acc, cur) => acc + cur.amount, 0);
    const gross = days * worker.wage;
    const net = gross - totalMusaedeh;
    const sigData = sigCanvas.toDataURL();

    const paper = document.getElementById('printableSettlement');
    paper.innerHTML = `
      <div style="border: 2px solid #000; padding: 24px; border-radius: 8px; font-family: Tahoma; direction: rtl;">
        <h2 style="text-align: center; margin: 0 0 10px;">برگه رسمی تسویه‌حساب قطعی کارگر روزمزد</h2>
        <p style="text-align: center; font-size: 0.9rem; margin-bottom: 20px;">تنظیم‌شده بر اساس ماده ۳۷ قانون کار جمهوری اسلامی ایران</p>
        
        <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px;" border="1" cellpadding="8">
          <tr>
            <td><strong>نام کارگر:</strong> ${worker.name}</td>
            <td><strong>تاریخ تنظیم:</strong> ${new Date().toLocaleDateString('fa-IR')}</td>
          </tr>
          <tr>
            <td><strong>میزان کارکرد:</strong> ${days} روز کاری</td>
            <td><strong>مبنای دستمزد:</strong> ${worker.wage.toLocaleString('fa-IR')} تومان</td>
          </tr>
          <tr>
            <td><strong>کل مطالبات ناخالص:</strong> ${gross.toLocaleString('fa-IR')} تومان</td>
            <td><strong>کسورات (مساعده):</strong> ${totalMusaedeh.toLocaleString('fa-IR')} تومان</td>
          </tr>
          <tr style="background:#f5f5f5;">
            <td colspan="2" style="font-size: 1.1rem; text-align: center;">
              <strong>مبلغ قطعی پرداخت‌شده و تسویه‌شده:</strong> ${net.toLocaleString('fa-IR')} تومان
            </td>
          </tr>
        </table>

        <p style="font-size: 0.85rem; line-height: 1.8; text-align: justify;">
          اینجانب <strong>${worker.name}</strong> اقرار می‌نمایم کلیه دستمزد، حق‌الزحمه و مطالبات ایام کارکرد خود را تا تاریخ فوق به‌طور کامل و نقداً/واریزی دریافت نموده و هیچ‌گونه ادعا یا اعتراضی در خصوص دستمزد، اضافه کاری یا سنوات نزد کارفرما و اداره تعاون، کار و رفاه اجتماعی ندارم و این سند به منزله تسویه‌حساب نهایی و قطعی می‌باشد.
        </p>

        <div style="display: flex; justify-content: space-between; margin-top: 40px; align-items: flex-end;">
          <div style="text-align: center; width: 45%;">
            <strong>امضا و اثر انگشت کارفرما:</strong>
            <div style="height: 80px;"></div>
          </div>
          <div style="text-align: center; width: 45%;">
            <strong>امضای دیجیتال و تایید کارگر:</strong><br>
            <img src="${sigData}" style="max-height: 80px; margin-top: 10px; border-bottom: 1px solid #000;">
          </div>
        </div>
      </div>
    `;

    paper.style.display = 'block';
    window.print();
    paper.style.display = 'none';
  }
</script>
</body>
</html>
