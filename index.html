<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>کارت ساعت هوشمند و قانونی کارگران</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root { --primary: #0f766e; --primary-dark: #115e59; --secondary: #1e293b; --bg: #f8fafc; --card-bg: #ffffff; --text: #0f172a; --text-muted: #64748b; --border: #e2e8f0; --success: #16a34a; --danger: #dc2626; --radius: 12px; --shadow: 0 4px 14px rgba(0, 0, 0, 0.05); }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
    body { background-color: var(--bg); color: var(--text); line-height: 1.6; padding-bottom: 70px; }
    .top-header { background: linear-gradient(135deg, #134e4a, #0f766e); color: #fff; padding: 20px 16px; border-radius: 0 0 20px 20px; box-shadow: 0 4px 20px rgba(15,118,110,0.2); }
    .header-content { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
    .header-title-row { display: flex; justify-content: space-between; align-items: center; }
    .app-title { font-size: 1.25rem; font-weight: 800; }
    .live-clock-badge { background: rgba(255,255,255,0.15); padding: 4px 12px; border-radius: 20px; font-size: 0.95rem; font-weight: 700; }
    .header-date-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; color: #ccfbf1; border-top: 1px solid rgba(255,255,255,0.15); padding-top: 8px; }
    .container { max-width: 900px; margin: 16px auto; padding: 0 16px; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin-bottom: 16px; box-shadow: var(--shadow); }
    .card-title { font-size: 1.05rem; font-weight: 800; color: var(--secondary); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    .card-title::before { content: ""; display: inline-block; width: 4px; height: 18px; background: var(--primary); border-radius: 4px; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
    input, select { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; background: #fff; color: var(--text); outline: none; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .date-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 18px; border-radius: 8px; border: none; font-weight: 700; font-size: 0.95rem; cursor: pointer; width: 100%; transition: 0.2s; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-success { background: var(--success); color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-group-action { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
    .stat-box { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; text-align: center; box-shadow: var(--shadow); }
    .stat-val { font-size: 1.3rem; font-weight: 900; color: var(--primary); }
    .stat-label { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; }
    .nav-tabs { display: flex; background: #e2e8f0; padding: 4px; border-radius: 12px; margin-bottom: 16px; gap: 4px; }
    .tab-btn { flex: 1; padding: 8px; text-align: center; border-radius: 8px; border: none; background: transparent; font-weight: 700; font-size: 0.85rem; cursor: pointer; color: var(--text-muted); }
    .tab-btn.active { background: #fff; color: var(--primary); box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; text-align: right; }
    th, td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
    th { background: #f1f5f9; color: var(--secondary); font-weight: 700; }
    .payslip { background: #fff; border: 2px solid #0f766e; border-radius: 16px; padding: 24px; margin-top: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
    .app-footer { background: #fff; border-top: 1px solid var(--border); text-align: center; padding: 14px 16px; font-size: 0.85rem; color: var(--text-muted); position: fixed; bottom: 0; left: 0; right: 0; z-index: 100; }
    .support-pill { background: #f1f5f9; color: #0f766e; padding: 3px 10px; border-radius: 20px; font-weight: 800; direction: ltr; }
  </style>
</head>
<body>

  <header class="top-header">
    <div class="header-content">
      <div class="header-title-row">
        <div class="app-title">📋 کارت ساعت هوشمند کارگران</div>
        <div class="live-clock-badge" id="liveClock">۰۰:۰۰:۰۰</div>
      </div>
      <div class="header-date-row">
        <span>امروز: <strong id="persianHeaderDate">...</strong></span>
        <span>پشتیبانی: <strong style="color:#a7f3d0">09371880982</strong></span>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="stats-grid">
      <div class="stat-box"><div class="stat-val" id="statWorkersCount">۰</div><div class="stat-label">تعداد کل</div></div>
      <div class="stat-box"><div class="stat-val" id="statPresentToday">۰</div><div class="stat-label">حاضرین امروز</div></div>
      <div class="stat-box"><div class="stat-val" id="statTotalHoursToday">۰</div><div class="stat-label">مجموع ساعت</div></div>
    </div>

    <nav class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('clock', event)">⏱️ تردد</button>
      <button class="tab-btn" onclick="switchTab('reports', event)">📊 فیش</button>
      <button class="tab-btn" onclick="switchTab('workers', event)">👷 پرسنل</button>
      <button class="tab-btn" onclick="switchTab('projects', event)">🏗️ تنظیمات</button>
    </nav>

    <section id="clockTab" class="tab-content">
      <div class="card">
        <div class="card-title">ثبت ورود/خروج</div>
        <div class="form-row">
          <div class="form-group"><label>کارگر:</label><select id="clockWorkerSelect"></select></div>
          <div class="form-group"><label>پروژه:</label><select id="clockProjectSelect"></select></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>نوع:</label><select id="attendanceType"><option value="عادی">عادی</option><option value="اضافه کار">اضافه کاری</option><option value="تعطیل کاری">تعطیل کاری</option></select></div>
          <div class="form-group"><label>توضیح:</label><input type="text" id="attendanceNotes"></div>
        </div>
        <div class="btn-group-action">
          <button class="btn btn-success" onclick="recordAttendance('ورود')">🟢 ورود</button>
          <button class="btn btn-danger" onclick="recordAttendance('خروج')">🔴 خروج</button>
        </div>
      </div>
    </section>

    <section id="reportsTab" class="tab-content" style="display: none;">
      <div class="card">
        <div class="card-title">فیش حقوقی</div>
        <div class="form-group"><label>کارگر:</label><select id="reportWorkerSelect"></select></div>
        <div class="form-row">
          <div class="form-group"><label>از تاریخ:</label><div id="startDatePicker" class="date-row"></div></div>
          <div class="form-group"><label>تا تاریخ:</label><div id="endDatePicker" class="date-row"></div></div>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-primary" style="flex:2" onclick="generatePayslip()">📄 صدور فیش</button>
            <button class="btn btn-outline" style="flex:1" onclick="exportCSV()">📥 CSV</button>
        </div>
      </div>
      <div id="payslipContainer" style="display: none;"></div>
    </section>

    <section id="workersTab" class="tab-content" style="display: none;">
      <div class="card">
        <div class="card-title">افزودن کارگر</div>
        <input type="text" id="newWorkerName" placeholder="نام" style="margin-bottom:8px">
        <input type="text" id="newWorkerWage" placeholder="دستمزد ساعتی" style="margin-bottom:8px">
        <button class="btn btn-primary" onclick="addWorker()">➕ ثبت</button>
      </div>
      <div class="card">
        <div class="table-responsive"><table id="workersTable"><thead><tr><th>نام</th><th>دستمزد</th><th>عملیات</th></tr></thead><tbody id="workersListTableBody"></tbody></table></div>
      </div>
    </section>

    <section id="projectsTab" class="tab-content" style="display: none;">
      <div class="card">
        <div class="card-title">مدیریت فایل پشتیبان</div>
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-outline" onclick="backupData()">📤 دانلود فایل پشتیبان</button>
            <button class="btn btn-outline" onclick="document.getElementById('importFile').click()">📥 وارد کردن فایل</button>
            <input type="file" id="importFile" style="display:none" onchange="restoreData(event)" accept=".json">
        </div>
      </div>
    </section>
  </main>

  <footer class="app-footer">کارت ساعت هوشمند | پشتیبانی: 09371880982</footer>

  <script>
    const DB_KEY = 'tati_worker_db';
    let db = { workers: [], projects: ['کارگاه'], attendance: [] };

    function saveDB() { localStorage.setItem(DB_KEY, JSON.stringify(db)); }
    function loadDB() {
      const saved = localStorage.getItem(DB_KEY);
      if (saved) db = JSON.parse(saved);
      if (!db.workers) db.workers = [];
      if (!db.attendance) db.attendance = [];
    }

    // تاریخ‌شمسی ساده برای نمایش و مقایسه
    function getPersianDateStr(date) {
        return new Intl.DateTimeFormat('fa-IR-u-ca-persian', { year: 'numeric', month: '2-digit', day: '2-digit' }).format(date).replace(/\//g, '/');
    }

    // ساخت سلکت‌های تاریخ شمسی
    function renderDateSelectors() {
        const now = new Date();
        const year = parseInt(new Intl.DateTimeFormat('fa-IR-u-ca-persian', {year:'numeric'}).format(now));
        
        ['startDatePicker', 'endDatePicker'].forEach(id => {
            const container = document.getElementById(id);
            container.innerHTML = `
                <select class="year-sel"><option>${year}</option></select>
                <select class="month-sel">${[...Array(12).keys()].map(i => `<option value="${i+1}">${i+1}</option>`).join('')}</select>
                <select class="day-sel">${[...Array(31).keys()].map(i => `<option value="${i+1}">${i+1}</option>`).join('')}</select>
            `;
            container.querySelector('.month-sel').value = now.getMonth() + 1; // تقریب ساده
            container.querySelector('.day-sel').value = now.getDate();
        });
    }

    function getDateFromSelectors(containerId) {
        const c = document.getElementById(containerId);
        const y = c.querySelector('.year-sel').value;
        const m = c.querySelector('.month-sel').value.padStart(2,'0');
        const d = c.querySelector('.day-sel').value.padStart(2,'0');
        return `${y}/${m}/${d}`;
    }

    function refreshUI() {
        // آپدیت سلکت‌ها
        const s = document.querySelectorAll('select[id$=Select]');
        s.forEach(sel => {
            const val = sel.value;
            sel.innerHTML = '';
            if(sel.id.includes('Worker')) db.workers.forEach(w => sel.innerHTML += `<option value="${w.id}">${w.name}</option>`);
            else db.projects.forEach(p => sel.innerHTML += `<option value="${p}">${p}</option>`);
            sel.value = val;
        });

        // آپدیت لیست کارگران
        const wBody = document.getElementById('workersListTableBody');
        wBody.innerHTML = '';
        db.workers.forEach(w => {
            wBody.innerHTML += `<tr><td>${w.name}</td><td>${w.wage}</td><td><button class="btn btn-danger" style="padding:2px 8px" onclick="deleteWorker(${w.id})">حذف</button></td></tr>`;
        });
    }

    function deleteWorker(id) {
        if(confirm('آیا مطمئنید؟ سوابق کاری این کارگر هم حذف می‌شود.')) {
            db.workers = db.workers.filter(w => w.id !== id);
            db.attendance = db.attendance.filter(a => a.workerId !== id);
            saveDB(); refreshUI();
        }
    }

    function addWorker() {
        const name = document.getElementById('newWorkerName').value;
        const wage = document.getElementById('newWorkerWage').value;
        if(name && wage) {
            db.workers.push({id: Date.now(), name, wage});
            saveDB(); refreshUI();
            alert('ثبت شد');
        }
    }

    function recordAttendance(type) {
        const workerId = parseInt(document.getElementById('clockWorkerSelect').value);
        const now = new Date();
        db.attendance.push({
            id: Date.now(),
            workerId,
            project: document.getElementById('clockProjectSelect').value,
            type,
            persianDate: getPersianDateStr(now),
            time: now.toLocaleTimeString('fa-IR', {hour: '2-digit', minute: '2-digit'})
        });
        saveDB(); alert('ثبت شد');
    }

    function generatePayslip() {
        const workerId = parseInt(document.getElementById('reportWorkerSelect').value);
        const start = getDateFromSelectors('startDatePicker');
        const end = getDateFromSelectors('endDatePicker');
        
        const worker = db.workers.find(w => w.id === workerId);
        const logs = db.attendance.filter(a => a.workerId === workerId && a.persianDate >= start && a.persianDate <= end);
        
        const container = document.getElementById('payslipContainer');
        container.style.display = 'block';
        container.innerHTML = `
            <div class="payslip">
                <h3>فیش حقوقی: ${worker.name}</h3>
                <p>از ${start} تا ${end}</p>
                <p>تعداد کل ثبت‌ها: ${logs.length}</p>
            </div>
        `;
    }

    function exportCSV() {
        const workerId = parseInt(document.getElementById('reportWorkerSelect').value);
        const logs = db.attendance.filter(a => a.workerId === workerId);
        let csv = "data:text/csv;charset=utf-8,تاریخ,زمان,نوع,پروژه\n";
        logs.forEach(l => csv += `${l.persianDate},${l.time},${l.type},${l.project}\n`);
        const encodedUri = encodeURI(csv);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "report.csv");
        document.body.appendChild(link);
        link.click();
    }

    function backupData() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db));
        const link = document.createElement("a");
        link.setAttribute("href", dataStr);
        link.setAttribute("download", "backup.json");
        document.body.appendChild(link);
        link.click();
    }

    function restoreData(e) {
        const reader = new FileReader();
        reader.onload = (event) => {
            db = JSON.parse(event.target.result);
            saveDB(); refreshUI(); alert('بازیابی شد');
        };
        reader.readAsText(e.target.files[0]);
    }

    function switchTab(t, e) {
        document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
        document.getElementById(t + 'Tab').style.display = 'block';
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
    }

    loadDB();
    renderDateSelectors();
    refreshUI();
    setInterval(() => document.getElementById('liveClock').innerText = new Date().toLocaleTimeString('fa-IR'), 1000);
  </script>
</body>
</html>
