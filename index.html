<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کارت ساعت - حضور غیاب و حقوق کارگران</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-20">

    <!-- Header -->
    <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-lg font-bold">⏱️ کارت ساعت (حساب‌وکتاب کارگران)</h1>
            <button onclick="openBackupModal()" class="bg-indigo-700 px-3 py-1.5 rounded-lg text-xs font-semibold">پشتیبان / بازیابی</button>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">
        
        <!-- Tabs -->
        <div class="flex bg-white rounded-xl p-1 shadow-sm border border-slate-200">
            <button onclick="switchTab('workers')" id="tab-workers" class="flex-1 py-2 text-sm font-bold rounded-lg bg-indigo-600 text-white">کارگران</button>
            <button onclick="switchTab('attendance')" id="tab-attendance" class="flex-1 py-2 text-sm font-bold rounded-lg text-slate-600">ثبت حضور</button>
            <button onclick="switchTab('reports')" id="tab-reports" class="flex-1 py-2 text-sm font-bold rounded-lg text-slate-600">گزارش و تسویه</button>
        </div>

        <!-- 1. WORKERS SECTION -->
        <section id="section-workers" class="space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
                <h2 class="font-bold text-slate-700">افزودن کارگر جدید</h2>
                <input type="text" id="workerName" placeholder="نام و نام خانوادگی کارگر" class="w-full p-2.5 border rounded-lg text-sm">
                <div class="grid grid-cols-2 gap-2">
                    <input type="number" id="workerDailyRate" placeholder="دستمزد روزانه (تومان)" class="w-full p-2.5 border rounded-lg text-sm">
                    <input type="number" id="workerHourlyRate" placeholder="نرخ اضافه‌کاری هر ساعت" class="w-full p-2.5 border rounded-lg text-sm">
                </div>
                <button onclick="addWorker()" class="w-full bg-indigo-600 text-white py-2.5 rounded-lg font-bold text-sm">ثبت کارگر</button>
            </div>

            <div class="space-y-2" id="workersList"></div>
        </section>

        <!-- 2. ATTENDANCE SECTION -->
        <section id="section-attendance" class="hidden space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
                <h2 class="font-bold text-slate-700">ثبت حضور و غیاب، مساعده و خروج</h2>
                
                <div>
                    <label class="text-xs text-slate-500">انتخاب کارگر</label>
                    <select id="attWorkerSelect" class="w-full p-2.5 border rounded-lg text-sm mt-1"></select>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-xs text-slate-500">ساعت ورود</label>
                        <input type="time" id="attCheckIn" class="w-full p-2.5 border rounded-lg text-sm mt-1">
                    </div>
                    <div>
                        <label class="text-xs text-slate-500">ساعت خروج</label>
                        <input type="time" id="attCheckOut" class="w-full p-2.5 border rounded-lg text-sm mt-1">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-xs text-slate-500">اضافه‌کاری (ساعت)</label>
                        <input type="number" id="attOvertime" value="0" step="0.5" class="w-full p-2.5 border rounded-lg text-sm mt-1">
                    </div>
                    <div>
                        <label class="text-xs text-slate-500">مساعده دریافتی (تومان)</label>
                        <input type="number" id="attAdvance" value="0" class="w-full p-2.5 border rounded-lg text-sm mt-1">
                    </div>
                </div>

                <!-- Camera Selfie & GPS -->
                <div class="border-2 border-dashed border-slate-300 p-3 rounded-xl text-center space-y-2">
                    <button type="button" onclick="capturePhoto()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-lg text-xs font-bold">📸 ثبت عکس سلفی در محل</button>
                    <div id="photoPreview" class="text-xs text-emerald-600 font-semibold"></div>
                    <input type="hidden" id="capturedImageBase64">
                </div>

                <div class="bg-slate-50 p-3 rounded-lg text-xs text-slate-600 flex justify-between items-center">
                    <span id="gpsStatus">📍 موقعیت مکانی: ثبت نشده</span>
                    <button type="button" onclick="getGPS()" class="text-indigo-600 font-bold underline">دریافت لوکیشن</button>
                </div>

                <button onclick="saveAttendance()" class="w-full bg-emerald-600 text-white py-2.5 rounded-lg font-bold text-sm">ثبت روزکاری</button>
            </div>
        </section>

        <!-- 3. REPORTS SECTION -->
        <section id="section-reports" class="hidden space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
                <h2 class="font-bold text-slate-700">گزارش و تسویه حساب قانونی</h2>
                <select id="reportWorkerSelect" class="w-full p-2.5 border rounded-lg text-sm" onchange="generateReport()"></select>
                <div id="reportContent" class="space-y-3 text-sm"></div>
            </div>
        </section>

    </main>

    <!-- Backup Modal -->
    <div id="backupModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white p-5 rounded-2xl w-full max-w-sm space-y-4">
            <h3 class="font-bold text-base">پشتیبان‌گیری و بازیابی اطلاعات</h3>
            <button onclick="exportData()" class="w-full bg-indigo-50 text-indigo-600 py-2.5 rounded-xl font-bold text-sm">دریافت فایل پشتیبان (JSON)</button>
            <input type="file" id="importFile" onchange="importData(event)" class="w-full text-xs text-slate-500">
            <button onclick="closeBackupModal()" class="w-full bg-slate-200 py-2 rounded-xl text-xs font-bold">بستن</button>
        </div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('kart_saat_db')) || { workers: [], logs: [] };
        let currentLat = null, currentLng = null, currentPhoto = '';

        function saveData() {
            localStorage.setItem('kart_saat_db', JSON.stringify(db));
        }

        function switchTab(tab) {
            ['workers', 'attendance', 'reports'].forEach(t => {
                document.getElementById('section-' + t).classList.add('hidden');
                document.getElementById('tab-' + t).className = 'flex-1 py-2 text-sm font-bold rounded-lg text-slate-600';
            });
            document.getElementById('section-' + tab).classList.remove('hidden');
            document.getElementById('tab-' + tab).className = 'flex-1 py-2 text-sm font-bold rounded-lg bg-indigo-600 text-white';
            if(tab === 'attendance' || tab === 'reports') updateSelects();
        }

        function addWorker() {
            const name = document.getElementById('workerName').value.trim();
            const daily = Number(document.getElementById('workerDailyRate').value);
            const hourly = Number(document.getElementById('workerHourlyRate').value);
            if(!name || !daily) return alert('لطفا نام و دستمزد روزانه را وارد کنید.');
            
            db.workers.push({ id: Date.now(), name, daily, hourly });
            saveData();
            document.getElementById('workerName').value = '';
            document.getElementById('workerDailyRate').value = '';
            document.getElementById('workerHourlyRate').value = '';
            renderWorkers();
            alert('کارگر با موفقیت ثبت شد.');
        }

        function renderWorkers() {
            const list = document.getElementById('workersList');
            list.innerHTML = db.workers.length === 0 ? '<p class="text-xs text-slate-400 text-center py-4">هنوز کارگری ثبت نشده است.</p>' : '';
            db.workers.forEach(w => {
                list.innerHTML += `<div class="bg-white p-3 rounded-xl border border-slate-200 flex justify-between items-center">
                    <div>
                        <h4 class="font-bold text-sm">${w.name}</h4>
                        <p class="text-xs text-slate-500">روزانه: ${w.daily.toLocaleString()} ت | اضافه‌کاری: ${(w.hourly||0).toLocaleString()} ت/ساعت</p>
                    </div>
                    <button onclick="deleteWorker(${w.id})" class="text-rose-500 text-xs font-bold">حذف</button>
                </div>`;
            });
        }

        function deleteWorker(id) {
            db.workers = db.workers.filter(w => w.id !== id);
            saveData();
            renderWorkers();
        }

        function updateSelects() {
            ['attWorkerSelect', 'reportWorkerSelect'].forEach(id => {
                const sel = document.getElementById(id);
                sel.innerHTML = db.workers.map(w => `<option value="${w.id}">${w.name}</option>`).join('');
            });
            generateReport();
        }

        function capturePhoto() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.capture = 'environment';
            input.onchange = e => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = event => {
                    currentPhoto = event.target.result;
                    document.getElementById('photoPreview').innerText = '✓ عکس با موفقیت ثبت شد';
                };
                reader.readAsDataURL(file);
            };
            input.click();
        }

        function getGPS() {
            if(navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    currentLat = pos.coords.latitude;
                    currentLng = pos.coords.longitude;
                    document.getElementById('gpsStatus').innerText = `📍 ثبت شد: ${currentLat.toFixed(4)}, ${currentLng.toFixed(4)}`;
                }, () => alert('خطا در دریافت موقعیت مکانی. لطفا GPS را روشن کنید.'));
            } else {
                alert('مرورگر شما از GPS پشتیبانی نمی‌کند.');
            }
        }

        function saveAttendance() {
            const workerId = Number(document.getElementById('attWorkerSelect').value);
            if(!workerId) return alert('لطفا یک کارگر انتخاب کنید.');
            
            const log = {
                id: Date.now(),
                workerId,
                date: new Date().toLocaleDateString('fa-IR'),
                checkIn: document.getElementById('attCheckIn').value,
                checkOut: document.getElementById('attCheckOut').value,
                overtime: Number(document.getElementById('attOvertime').value),
                advance: Number(document.getElementById('attAdvance').value),
                photo: currentPhoto,
                lat: currentLat,
                lng: currentLng
            };

            db.logs.push(log);
            saveData();
            alert('حضور و غیاب ثبت شد.');
            currentPhoto = '';
            currentLat = null; currentLng = null;
            document.getElementById('photoPreview').innerText = '';
            document.getElementById('gpsStatus').innerText = '📍 موقعیت مکانی: ثبت نشده';
        }

        function generateReport() {
            const workerId = Number(document.getElementById('reportWorkerSelect').value);
            const worker = db.workers.find(w => w.id === workerId);
            const container = document.getElementById('reportContent');
            if(!worker) { container.innerHTML = 'کارگری انتخاب نشده است.'; return; }

            const logs = db.logs.filter(l => l.workerId === workerId);
            let totalDays = logs.length;
            let totalAdvance = logs.reduce((sum, l) => sum + (l.advance || 0), 0);
            let totalOvertimeHours = logs.reduce((sum, l) => sum + (l.overtime || 0), 0);
            let grossPay = (totalDays * worker.daily) + (totalOvertimeHours * (worker.hourly || 0));
            let netPay = grossPay - totalAdvance;

            container.innerHTML = `
                <div class="bg-slate-50 p-3 rounded-lg space-y-1 text-xs">
                    <p>تعداد روز کارکرد: <b>${totalDays} روز</b></p>
                    <p>مجموع اضافه‌کاری: <b>${totalOvertimeHours} ساعت</b></p>
                    <p>مساعده‌های دریافتی: <b class="text-rose-600">${totalAdvance.toLocaleString()} تومان</b></p>
                    <hr>
                    <p class="text-sm font-bold text-indigo-600">مبلغ قابل پرداخت نهایی: ${netPay.toLocaleString()} تومان</p>
                </div>
                <button onclick="window.print()" class="w-full bg-slate-800 text-white py-2 rounded-lg text-xs font-bold">🖨️ چاپ برگ تسویه حساب قانونی</button>
            `;
        }

        function openBackupModal() { document.getElementById('backupModal').classList.remove('hidden'); }
        function closeBackupModal() { document.getElementById('backupModal').classList.add('hidden'); }
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", "kart-saat-backup.json");
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        }
        function importData(e) {
            const reader = new FileReader();
            reader.onload = event => {
                db = JSON.parse(event.target.result);
                saveData();
                renderWorkers();
                alert('اطلاعات با موفقیت بازیابی شد.');
                closeBackupModal();
            };
            reader.readAsText(e.target.files[0]);
        }

        renderWorkers();
    </script>
</body>
</html>
